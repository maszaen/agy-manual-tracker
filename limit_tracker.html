<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Limit Tracker</title>
<script>
  /* Terapkan tema sebelum render agar tidak berkedip */
  (function () {
    var t = null;
    try { t = localStorage.getItem('limit-tracker-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand"><span class="logo" data-ic="gauge"></span><span class="brand-name">Limit Tracker</span></div>
    <div class="topbar-actions">
      <button class="sync" id="syncBtn" type="button" aria-label="Status penyimpanan file">
        <span data-ic="drive"></span><span id="syncLabel">Tautkan file JSON</span>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Ganti tema" title="Ganti tema"></button>
      <div class="pop-wrap">
        <button class="icon-btn" type="button" data-pop="dataMenu" aria-haspopup="menu" aria-expanded="false" aria-label="Menu data" title="Menu data"><span data-ic="more"></span></button>
        <div class="pop" id="dataMenu" role="menu" hidden>
          <div class="pop-title">Penyimpanan file</div>
          <button type="button" role="menuitem" data-m="link"><span data-ic="link"></span>Buat / tautkan file JSON</button>
          <button type="button" role="menuitem" data-m="open"><span data-ic="folder"></span>Buka file JSON</button>
          <button type="button" role="menuitem" data-m="unlink" id="mUnlink"><span data-ic="unlink"></span>Putuskan tautan</button>
          <div class="pop-sep"></div>
          <div class="pop-title">Cadangan</div>
          <button type="button" role="menuitem" data-m="download"><span data-ic="download"></span>Unduh .json</button>
          <button type="button" role="menuitem" data-m="json"><span data-ic="code"></span>Lihat / impor teks JSON</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="adder" aria-label="Tambah akun">
    <form id="addForm" autocomplete="off">
      <label class="field">
        <span data-ic="userPlus"></span>
        <input id="email" type="text" placeholder="Tambah akun, bisa banyak sekaligus (pisahkan spasi / koma)" aria-label="Akun baru">
        <button class="add-btn" id="addBtn" type="submit" disabled aria-label="Tambah akun" title="Tambah akun"><span data-ic="plus"></span></button>
      </label>
    </form>
  </section>

  <section class="stats" id="stats" aria-label="Ringkasan"></section>

  <section aria-labelledby="listTitle">
    <div class="listbar">
      <h2 id="listTitle">Akun <span class="count" id="count">0</span></h2>
      <div class="listbar-tools">
        <div class="search" id="search">
          <button class="icon-btn" id="searchBtn" type="button" aria-label="Cari akun" title="Cari akun"><span data-ic="search"></span></button>
          <input id="q" type="search" placeholder="Cari akun…" aria-label="Cari akun" tabindex="-1">
        </div>
        <div class="pop-wrap">
          <button class="icon-btn" id="sortBtn" type="button" data-pop="sortMenu" aria-haspopup="menu" aria-expanded="false" aria-label="Urutkan" title="Urutkan"><span data-ic="sort"></span><span class="badge-dot"></span></button>
          <div class="pop pop-sort" id="sortMenu" role="menu" hidden></div>
        </div>
        <button class="icon-btn" id="expBtn" type="button" aria-label="Buka semua" title="Buka semua"></button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <p class="foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> pilih akun</span>
    <span><kbd>Ctrl</kbd>+<kbd>V</kbd> tempel ke akun terpilih</span>
    <span><kbd>/</kbd> tambah akun</span>
  </p>
</main>

<dialog id="jsonDlg" aria-labelledby="jsonTitle">
  <form method="dialog" class="dlg-head">
    <h3 id="jsonTitle">Data JSON</h3>
    <button class="icon-btn" aria-label="Tutup"><span data-ic="x"></span></button>
  </form>
  <textarea id="jsonTxt" spellcheck="false" aria-label="Isi JSON"></textarea>
  <div class="dlg-foot">
    <span class="muted" id="jsonMsg"></span>
    <button class="btn" id="jsonCopy" type="button"><span data-ic="copy"></span>Salin</button>
    <button class="btn primary" id="jsonLoad" type="button"><span data-ic="check"></span>Muat data</button>
  </div>
</dialog>

<div class="pop ctx" id="ctxMenu" role="menu" hidden></div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
